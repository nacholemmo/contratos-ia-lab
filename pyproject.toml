# Raíz del workspace de uv: coordina los paquetes de packages/.
# Todos comparten un único uv.lock y un único .venv/ en esta carpeta.

[tool.uv.workspace]
members = ["packages/*"]

# --- ruff: lint y formato para todo el monorepo ---
[tool.ruff]
target-version = "py312"
line-length = 100
# Dónde viven los paquetes propios: así isort agrupa `core` (y los que vengan) como first-party.
src = ["packages/*/src"]
# archive/ es referencia del dominio anterior: no se revisa.
extend-exclude = ["archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "T20"]

# --- pytest: un tests/ por paquete ---
[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = ["--strict-markers", "-m", "not slow and not network"]
markers = [
    "slow: tests lentos (por ejemplo, los que llaman a un LLM)",
    "network: tests que necesitan internet",
]

[dependency-groups]
dev = [
    "pypdf>=6.21.2",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
