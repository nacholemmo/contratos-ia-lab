[project]
name = "synthetic"
version = "0.1.0"
description = "Generador determinístico de contratos y documentos sintéticos (ground truth)."
readme = "README.md"
authors = [
    { name = "Ignacio Lemmo", email = "ignacio.lemmo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "core",
    "faker>=40.43.0",
    "fpdf2>=2.8.9",
    "jinja2>=3.1.6",
    "num2words>=0.5.14",
    "pillow>=13.0.0",
    "pypdfium2>=5.14.0",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
core = { workspace = true }
