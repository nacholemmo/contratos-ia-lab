[project]
name = "extractor"
version = "0.1.0"
description = "Clasificación y extracción de datos de documentos con LLM (servicio sin estado)."
readme = "README.md"
authors = [
    { name = "Ignacio Lemmo", email = "ignacio.lemmo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "core",
    "pydantic-settings>=2.16.1",
]

[project.scripts]
llm-ping = "extractor.cli:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
core = { workspace = true }
