[project]
name = "extractor"
version = "0.1.0"
description = "Clasificación y extracción de datos de documentos con LLM (servicio sin estado)."
readme = "README.md"
authors = [
    { name = "Ignacio Lemmo", email = "ignacio.lemmo@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.3.0",
    "core",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.1",
    "pypdfium2>=5.14.0",
]

[project.scripts]
llm-ping = "extractor.cli:main"
experimento-entrada = "extractor.cli:experimento_entrada"
clasificar-reglas = "extractor.cli:clasificar_reglas"
clasificar-zero-shot = "extractor.cli:clasificar_zero_shot"
clasificar-zero-shot-def = "extractor.cli:clasificar_zero_shot_def"
clasificar-few-shot = "extractor.cli:clasificar_few_shot"
clasificar-vectores = "extractor.cli:clasificar_vectores"
comparar-clasificadores = "extractor.cli:comparar_clasificadores"

[project.optional-dependencies]
ml = [
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "torch>=2.15.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
core = { workspace = true }
